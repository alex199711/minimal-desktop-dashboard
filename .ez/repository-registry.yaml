status: phase1-complete

principles:
  - "Original work and upstream open source must be distinguishable at a glance."
  - "Prefer upstream links/packages over maintaining unnecessary forks."
  - "When local behavior must diverge, create an owned adapter/connector/workflow layer instead of hiding the upstream origin."
  - "No destructive rename/archive/delete actions are authorized by this registry."
  - "Human-facing README and machine-facing metadata should describe the same project identity."

